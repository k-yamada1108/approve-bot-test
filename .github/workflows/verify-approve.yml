name: 【検証】App による approve が必須approveにカウントされるか

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 1. approve-bot App のトークンを取得
      - name: approve-bot App トークン取得
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APPROVE_BOT_APP_ID }}
          private-key: ${{ secrets.APPROVE_BOT_PEM }}

      # 2. リポジトリを取得（GITHUB_TOKEN で普通にチェックアウト）
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. テスト用ブランチを作って PR を作成（作成者は github-actions[bot] とは別に、
      #    ここでは GITHUB_TOKEN で作成する。approve は別人格の app-token で行う）
      - name: テスト用 PR を作成
        id: make-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="verify/approve-test-${{ github.run_id }}"
          git checkout -b "${BRANCH}"
          echo "verify ${{ github.run_id }} $(date -u)" > verify-approve.txt
          git add verify-approve.txt
          git commit -m "検証用: approveテスト ${{ github.run_id }}"
          git push origin "${BRANCH}"

          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "【検証】approve カウント確認 ${{ github.run_id }}" \
            --body "App による approve が必須approveにカウントされるかの検証用PRです。")
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "検証PR: ${PR_URL}"

      # 4. approve-bot App のトークンで approve する
      - name: approve-bot で承認
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr review "${{ steps.make-pr.outputs.pr_url }}" --approve \
            --body "approve-bot による自動承認（検証）"

      # 5. approve の状態を出力（カウントされたか確認用）
      - name: approve 結果を確認
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 検証結果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 検証PR: ${{ steps.make-pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### レビュー一覧（reviews API）" >> "$GITHUB_STEP_SUMMARY"
          PR_NUMBER=$(gh pr view "${{ steps.make-pr.outputs.pr_url }}" --json number --jq '.number')
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | "- \(.user.login) (\(.user.type)): \(.state)"' >> "$GITHUB_STEP_SUMMARY"
